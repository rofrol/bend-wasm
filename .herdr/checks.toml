# Checks `herdr todo run --check NAME...` may run to verify a worker's commit:
# each name maps to a program and its arguments, run as they are in the
# worker's folder (no shell, so nothing is expanded or split).

[checks]
# An explicit parent-to-head diff also checks merge commits, unlike git show.
whitespace = ["git", "diff", "--check", "HEAD^", "HEAD"]
# Native vs the JS and wasm lanes on the corpus of tests/differential/corpus.txt (README there).
differential = ["sh", "tests/differential/run.sh"]
# The Bend patch series applies cleanly to exactly the pinned commit (patches/README.md).
patches = ["sh", "scripts/check-patches"]
